name: Artifactline
description: Audit GitHub Actions artifact handoffs before workflows run
author: KanadeK

branding:
  icon: git-merge
  color: purple

inputs:
  path:
    description: Workflow file, workflow directory, or repository root to audit
    required: false
    default: .github/workflows
  format:
    description: Report format (terminal, json, or sarif)
    required: false
    default: terminal
  output:
    description: Optional report file; omit to print the report in the job log
    required: false
    default: ""
  strict:
    description: Return exit 1 for warnings as well as errors
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Artifactline
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - name: Audit artifact handoffs
      shell: bash
      env:
        ARTIFACTLINE_INPUT_PATH: ${{ inputs.path }}
        ARTIFACTLINE_INPUT_FORMAT: ${{ inputs.format }}
        ARTIFACTLINE_INPUT_OUTPUT: ${{ inputs.output }}
        ARTIFACTLINE_INPUT_STRICT: ${{ inputs.strict }}
      run: |
        args=(
          audit "$ARTIFACTLINE_INPUT_PATH"
          --format "$ARTIFACTLINE_INPUT_FORMAT"
        )
        if [[ -n "$ARTIFACTLINE_INPUT_OUTPUT" ]]; then
          args+=(--output "$ARTIFACTLINE_INPUT_OUTPUT")
        fi
        if [[ "$ARTIFACTLINE_INPUT_STRICT" == "true" ]]; then
          args+=(--strict)
        fi
        python -m artifactline "${args[@]}"
