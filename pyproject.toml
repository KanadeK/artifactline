[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "artifactline"
version = "0.1.0"
description = "Audit GitHub Actions artifact handoffs before workflows run"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "KanadeK" }]
dependencies = ["PyYAML>=6.0.2,<7"]
keywords = ["github-actions", "artifacts", "ci", "static-analysis", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "coverage>=7.6",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
artifactline = "artifactline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["artifactline"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["artifactline"]

[tool.coverage.report]
fail_under = 90
show_missing = true
